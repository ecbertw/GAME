name: JUMP Browser Debug
on:
  push:
    branches: [debug/jump10-browser]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --omit=dev --ignore-scripts
      - run: npm install --no-save @electric-sql/pglite playwright
      - run: npx playwright install chromium
      - run: node tests/live-smoke.cjs
