name: EIXO Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=dev --ignore-scripts
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: JUMP physics and instance tests
        run: node --test tests/*.test.js
      - name: Reject tracked secrets and private runtime files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)(\.env($|\.)|security\.env$|.*\.pem$|.*\.key$)' || true)"
          if [ -n "$bad" ]; then
            echo "Sensitive runtime files are tracked:"
            echo "$bad"
            exit 1
          fi
      - name: Secret-pattern smoke scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|client_secret[[:space:]]*[:=][[:space:]]*[^$<{[:space:]]|DATABASE_URL[[:space:]]*=[[:space:]]*(postgres|postgresql)://[^$<{[:space:]])' -- ':!ops/security/*' ':!.github/*'; then
            echo "Potential hard-coded secret detected."
            exit 1
          fi


  appsec-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=dev --ignore-scripts
      - name: Start isolated EIXO server
        shell: bash
        env:
          ALLOW_MEMORY_DB: '1'
          HOST: 127.0.0.1
          PORT: '3100'
          PUBLIC_HOSTS: 127.0.0.1,localhost
        run: |
          node server-start.js >/tmp/eixo-ci.log 2>&1 &
          echo $! >/tmp/eixo-ci.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3100/health >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/eixo-ci.log
          exit 1
      - name: Public-surface regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)" = "200"
          for p in server.js auth-server.js paypal-server.js jump-server.js jump-team-server.js server-start.js package.json README.md .git/HEAD .env ops/nginx/eixo-security.conf.example; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100/$p")"
            test "$code" = "404" || { echo "$p returned $code"; exit 1; }
          done
      - name: Host and CSRF regression tests
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:3100/)"
          test "$code" = "421"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Host: 127.0.0.1:3100' -H 'Origin: https://evil.example' -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:3100/api/auth/login)"
          test "$code" = "403"
      - name: Security-header regression tests
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sSI -H 'Host: 127.0.0.1:3100' http://127.0.0.1:3100/ | tr '[:upper:]' '[:lower:]')"
          grep -q '^content-security-policy:' <<<"$headers"
          grep -q '^x-content-type-options: nosniff' <<<"$headers"
          grep -q '^x-frame-options: deny' <<<"$headers"
          grep -q '^referrer-policy:' <<<"$headers"
      - name: Traversal and payload-limit regression tests
        shell: bash
        run: |
          set -euo pipefail
          for p in '/%2e%2e/server.js' '/%2e%2e/%2e%2e/etc/passwd' '/..%2fserver.js'; do
            code="$(curl --path-as-is -sS -o /dev/null -w '%{http_code}' -H 'Host: 127.0.0.1:3100' "http://127.0.0.1:3100$p")"
            case "$code" in 400|403|404) ;; *) echo "Traversal probe $p returned $code"; exit 1;; esac
          done
          python3 -c 'import json; print(json.dumps({"message":"A"*40000}))' >/tmp/eixo-big.json
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Host: 127.0.0.1:3100' -H 'Origin: http://127.0.0.1:3100' -H 'Content-Type: application/json' --data-binary @/tmp/eixo-big.json http://127.0.0.1:3100/api/contact)"
          test "$code" = "413" || { echo "Oversized body returned $code"; exit 1; }
      - name: Bounded resilience check
        shell: bash
        run: |
          set -euo pipefail
          seq 1 600 | xargs -P20 -I{} sh -c 'curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:3100/health'
          curl -fsS http://127.0.0.1:3100/health >/dev/null
      - name: Stop isolated EIXO server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/eixo-ci.pid ]; then kill "$(cat /tmp/eixo-ci.pid)" 2>/dev/null || true; fi
          cat /tmp/eixo-ci.log 2>/dev/null || true


  jump-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --omit=dev --ignore-scripts
      - name: Install browser test dependencies
        run: npm install --no-save @electric-sql/pglite playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JUMP browser integration
        run: node tests/browser-jump.cjs
