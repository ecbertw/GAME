<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030711"/>
    <stop offset=".42" stop-color="#07172a"/>
    <stop offset=".72" stop-color="#07111f"/>
    <stop offset="1" stop-color="#040811"/>
  </linearGradient>
  <radialGradient id="nebula" cx=".62" cy=".28" r=".62">
    <stop offset="0" stop-color="#2f4f8d" stop-opacity=".22"/>
    <stop offset=".45" stop-color="#1f3769" stop-opacity=".08"/>
    <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="planet" cx=".38" cy=".32">
    <stop offset="0" stop-color="#2a5b96"/>
    <stop offset=".55" stop-color="#173d73"/>
    <stop offset="1" stop-color="#07162d"/>
  </radialGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b7fb0" stop-opacity="0"/>
    <stop offset=".5" stop-color="#4b7fb0" stop-opacity=".08"/>
    <stop offset="1" stop-color="#4b7fb0" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
    <path d="M96 0H0V96" fill="none" stroke="#1c3855" stroke-width="1" opacity=".22"/>
  </pattern>
  <pattern id="windows" width="54" height="38" patternUnits="userSpaceOnUse">
    <rect x="8" y="10" width="4" height="11" rx="2" fill="#2b6689" opacity=".28"/>
    <rect x="29" y="5" width="3" height="8" rx="1.5" fill="#386f90" opacity=".20"/>
  </pattern>
  <filter id="glowBlue" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowRed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="1080" fill="url(#nebula)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>

<!-- distant stars -->
<g fill="#87b8dd" opacity=".34">
  <circle cx="98" cy="118" r="1.4"/><circle cx="182" cy="80" r="1"/><circle cx="272" cy="154" r="1.2"/>
  <circle cx="384" cy="92" r="1"/><circle cx="508" cy="132" r="1.3"/><circle cx="612" cy="70" r="1"/>
  <circle cx="744" cy="144" r="1.4"/><circle cx="844" cy="88" r="1.1"/><circle cx="963" cy="125" r="1.3"/>
  <circle cx="1105" cy="76" r="1"/><circle cx="1228" cy="131" r="1.5"/><circle cx="1364" cy="94" r="1"/>
  <circle cx="1487" cy="148" r="1.2"/><circle cx="1632" cy="84" r="1.1"/><circle cx="1785" cy="128" r="1.4"/>
</g>

<!-- moon / planet -->
<g opacity=".95">
  <circle cx="1540" cy="288" r="228" fill="url(#planet)" stroke="#3778bd" stroke-width="3"/>
  <path d="M1308 298c66-148 226-235 385-210" fill="none" stroke="#8bc4f7" stroke-width="2" opacity=".18"/>
  <path d="M1298 308c91-83 253-121 406-73" fill="none" stroke="#6b9ac5" stroke-width="1.5" opacity=".14"/>
  <ellipse cx="1540" cy="288" rx="278" ry="72" fill="none" stroke="#446f9b" stroke-width="2" opacity=".12" transform="rotate(-12 1540 288)"/>
</g>

<!-- soft atmospheric layers -->
<path d="M0 382C360 330 620 405 910 364s540-118 1010-63v265H0z" fill="url(#haze)" opacity=".46"/>
<ellipse cx="980" cy="620" rx="920" ry="210" fill="#183553" opacity=".05" filter="url(#soft)"/>

