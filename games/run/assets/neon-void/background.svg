<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#02050a"/>
    <stop offset=".42" stop-color="#061326"/>
    <stop offset="1" stop-color="#03070e"/>
  </linearGradient>
  <radialGradient id="planet">
    <stop offset="0" stop-color="#204f86"/>
    <stop offset=".62" stop-color="#0d2d59"/>
    <stop offset="1" stop-color="#06142c"/>
  </radialGradient>
  <filter id="b" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8" result="x"/>
    <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="r" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="x"/>
    <feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
    <path d="M96 0H0V96" fill="none" stroke="#163451" stroke-width="1" opacity=".34"/>
  </pattern>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<circle cx="1530" cy="300" r="235" fill="url(#planet)" stroke="#2c69a9" stroke-width="3" opacity=".92"/>
<path d="M1306 303c76-154 245-242 405-206" fill="none" stroke="#6ea2d4" stroke-width="2" opacity=".28"/>
<rect width="1920" height="1080" fill="url(#grid)"/>

