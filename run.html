<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>EIXO RUN — First Light</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/run/run.css"></head><body><div class="run-shell">
<header class="run-top"><a href="/" class="run-logo" style="color:white;text-decoration:none">EIXO <b>RUN</b></a><span class="run-world">ASTRAL 01 — FIRST LIGHT</span><div class="run-actions"><label class="echo"><input id="pbEcho" type="checkbox" checked> PB ECHO</label><label class="echo"><input id="wrEcho" type="checkbox"> WORLD ECHO</label><a href="/" class="label">EIXO HOME</a><button id="retryTop">RETRY</button></div></header>
<main class="run-stage"><canvas id="runCanvas"></canvas><div class="hud"><div class="hud-box"><small>TIME</small><strong id="runTime">00:00.000</strong></div><div class="hud-box"><small>PB</small><strong id="runDelta">—</strong></div><div class="hud-box shards"><small>SHARDS</small><strong id="runShards">0 / 42</strong></div></div>

<div class="results hidden" id="results"><h2 id="resultTitle">RUN COMPLETE</h2><p>ASTRAL 01 — FIRST LIGHT</p><div class="results-grid"><div class="metric"><small>TIME</small><b id="resultTime">—</b></div><div class="metric"><small>PB</small><b id="resultPb">—</b></div><div class="metric"><small>SHARDS</small><b id="resultShards">—</b></div><div class="metric"><small>SECRETS</small><b id="resultSecrets">—</b></div></div><button class="primary" id="retryButton">RETRY</button> <a href="/rankings" style="color:#bcd3ff">RANKING</a></div>
</main></div><script src="/run/engine/physics-core.js"></script><script type="module" src="/run/run-client.mjs"></script></body></html>
